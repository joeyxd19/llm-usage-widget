name: 打包 Windows EXE

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "要构建的 tag（如 v2.4.3），留空则使用最新 tag"
        required: false
        default: ""

permissions:
  contents: write

# 代码签名（可选，属用户决策）：需先购买 OV 级代码签名证书，或改用
# Azure Trusted Signing；把 PFX 的 base64 放进仓库 Secret
# WINDOWS_SIGN_CERT_PFX、证书密码放进 WINDOWS_SIGN_CERT_PASSWORD。
# 未配置 Secret 时下面的签名步骤自动跳过，发布流程不受影响。
env:
  SIGN_CERT: ${{ secrets.WINDOWS_SIGN_CERT_PFX }}

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: 解析目标 tag
        id: tag
        shell: bash
        run: |
          if [ -n "${{ github.event.inputs.tag }}" ]; then
            TAG="${{ github.event.inputs.tag }}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::非法 tag「$TAG」：需形如 v2.6.0（手动触发时请填写 tag 输入，留空会误用分支名）"
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: 检出代码
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.tag.outputs.tag }}
          fetch-depth: 0

      - name: 解析上一个 tag
        id: prev
        shell: bash
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          PREV_TAG=$(git tag --sort=-v:refname | grep -v "^${TAG}$" | head -1 || true)
          echo "上一个 tag：${PREV_TAG:-无}"
          echo "tag=$PREV_TAG" >> "$GITHUB_OUTPUT"

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: 安装依赖
        run: pip install -r requirements.txt

      - name: 安装 Inno Setup
        run: choco install innosetup -y

      - name: 打包 onedir（安装包内容源）
        shell: bash
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          VERSION="${TAG#v}"
          pyinstaller --noconsole --clean \
            --collect-all PySide6 \
            --distpath dist/onedir --workpath build/onedir \
            --name "llm-usage-widget" \
            src/qt/app.py

      - name: 生成当前版本 manifest
        shell: bash
        env:
          TAG: ${{ steps.tag.outputs.tag }}
          PREV_TAG: ${{ steps.prev.outputs.tag }}
        run: |
          VERSION="${TAG#v}"
          PREV_VERSION=""
          if [ -n "$PREV_TAG" ]; then PREV_VERSION="${PREV_TAG#v}"; fi
          python scripts/generate_manifest.py \
            "dist/onedir/llm-usage-widget" "${VERSION}" "${PREV_VERSION}" \
            > "dist/llm-usage-widget_v${VERSION}_manifest.json"

      - name: 尝试生成增量更新包 delta.zip
        shell: bash
        env:
          TAG: ${{ steps.tag.outputs.tag }}
          PREV_TAG: ${{ steps.prev.outputs.tag }}
        run: |
          VERSION="${TAG#v}"
          DELTA_ZIP="dist/llm-usage-widget_v${VERSION}_delta.zip"
          DELTA_JSON="dist/llm-usage-widget_v${VERSION}_delta.json"
          echo "当前 tag: $TAG, 上一个 tag: ${PREV_TAG:-无}"
          if [ -n "$PREV_TAG" ]; then
            mkdir -p /tmp/prev
            MANIFEST_URL="https://github.com/joeyxd19/llm-usage-widget/releases/download/${PREV_TAG}/llm-usage-widget_${PREV_TAG}_manifest.json"
            echo "尝试下载上一版本 manifest: $MANIFEST_URL"
            if curl -fsSL -o /tmp/prev/manifest.json "$MANIFEST_URL"; then
              echo "已获取 $PREV_TAG 的 manifest，开始生成 delta"
              python scripts/generate_delta.py \
                "dist/onedir/llm-usage-widget" \
                "dist/llm-usage-widget_v${VERSION}_manifest.json" \
                "/tmp/prev/manifest.json" \
                "$DELTA_ZIP" "$DELTA_JSON" \
                || echo "delta 生成失败，将回退为完整包"
            else
              echo "无法下载上一版本 manifest，delta 将回退为完整包"
            fi
          fi
          if [ -f "$DELTA_ZIP" ]; then
            ls -lh "$DELTA_ZIP"
          else
            echo "未生成 delta.zip，回退到复制完整 update.zip"
          fi

      - name: 打包自动更新补丁包（不再作为便携版分发）
        shell: pwsh
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          $v = $env:TAG.Substring(1)
          # 把 manifest.json 也放进 update.zip，便于离线核对
          Copy-Item "dist/llm-usage-widget_v${v}_manifest.json" `
            "dist/onedir/llm-usage-widget/manifest.json" -Force
          Compress-Archive -Path "dist/onedir/llm-usage-widget" `
            -DestinationPath "dist/llm-usage-widget_v${v}_update.zip" -Force

      - name: 编译安装包 Setup.exe
        shell: pwsh
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          $v = $env:TAG.Substring(1)
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DMyAppVersion=$v" scripts/setup.iss

      - name: 补齐 delta.zip（生成失败时回退为完整 update.zip）
        shell: pwsh
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          $v = $env:TAG.Substring(1)
          $delta = "dist/llm-usage-widget_v${v}_delta.zip"
          if (-not (Test-Path $delta)) {
            Copy-Item "dist/llm-usage-widget_v${v}_update.zip" $delta -Force
          }

      # ---- 代码签名（预留）----
      # 只签 Setup.exe（用户主要分发入口）。若要做到全覆盖（update.zip /
      # delta.zip 里的 onedir exe 也签名），需把签名步骤挪到「打包 onedir」
      # 之后、压缩之前，对内部 exe 签名后再压缩。
      - name: 签名安装包（未配置证书时自动跳过）
        if: env.SIGN_CERT != ''
        shell: pwsh
        env:
          SIGN_CERT_PASSWORD: ${{ secrets.WINDOWS_SIGN_CERT_PASSWORD }}
        run: |
          $pfxPath = Join-Path $env:RUNNER_TEMP "signing.pfx"
          [IO.File]::WriteAllBytes(
            $pfxPath, [Convert]::FromBase64String($env:SIGN_CERT))
          try {
            $signtool = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin" `
              -Recurse -Filter signtool.exe |
              Where-Object { $_.FullName -match 'x64' } |
              Select-Object -First 1 -ExpandProperty FullName
            $targets = (Get-ChildItem "dist/installer/*.exe").FullName
            & $signtool sign /f $pfxPath /p $env:SIGN_CERT_PASSWORD `
              /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 $targets
            if ($LASTEXITCODE -ne 0) { throw "signtool 退出码 $LASTEXITCODE" }
          } finally {
            Remove-Item $pfxPath -Force -ErrorAction SilentlyContinue
          }

      # ---- 校验和封签（v3.2.0 起）----
      # manifest 先于两个 zip 生成，等 update.zip / delta.zip 全部就绪后，
      # 把它们的 sha256 补写进 manifest 的 packages 段；客户端下载后按
      # 它校验完整性，损坏的包不会被交给安装脚本替换应用文件。
      - name: 封签更新包校验和
        shell: bash
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          VERSION="${TAG#v}"
          python scripts/generate_manifest.py --seal \
            "dist/llm-usage-widget_v${VERSION}_manifest.json" \
            "dist/llm-usage-widget_v${VERSION}_update.zip" \
            "dist/llm-usage-widget_v${VERSION}_delta.zip"

      - name: 上传到 Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          files: |
            dist/installer/*.exe
            dist/llm-usage-widget_v*_update.zip
            dist/llm-usage-widget_v*_delta.zip
            dist/llm-usage-widget_v*_manifest.json
