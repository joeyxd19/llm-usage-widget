name: 打包 Windows EXE

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "要构建的 tag（如 v2.4.3），留空则使用最新 tag"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: 解析目标 tag
        id: tag
        shell: bash
        run: |
          if [ -n "${{ github.event.inputs.tag }}" ]; then
            TAG="${{ github.event.inputs.tag }}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::非法 tag「$TAG」：需形如 v2.6.0（手动触发时请填写 tag 输入，留空会误用分支名）"
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: 检出代码
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.tag.outputs.tag }}
          fetch-depth: 0

      - name: 解析上一个 tag
        id: prev
        shell: bash
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          PREV_TAG=$(git tag --sort=-v:refname | grep -v "^${TAG}$" | head -1 || true)
          echo "上一个 tag：${PREV_TAG:-无}"
          echo "tag=$PREV_TAG" >> "$GITHUB_OUTPUT"

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装依赖
        run: pip install pyinstaller==6.22.3 customtkinter==6.0.0

      - name: 安装 Inno Setup
        run: choco install innosetup -y

      - name: 打包 onedir（安装包内容源）
        shell: bash
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          VERSION="${TAG#v}"
          pyinstaller --noconsole --clean \
            --collect-all customtkinter \
            --distpath dist/onedir --workpath build/onedir \
            --name "llm-usage-widget" \
            src/usage_widget.pyw

      - name: 生成当前版本 manifest
        shell: bash
        env:
          TAG: ${{ steps.tag.outputs.tag }}
          PREV_TAG: ${{ steps.prev.outputs.tag }}
        run: |
          VERSION="${TAG#v}"
          PREV_VERSION=""
          if [ -n "$PREV_TAG" ]; then PREV_VERSION="${PREV_TAG#v}"; fi
          python scripts/generate_manifest.py \
            "dist/onedir/llm-usage-widget" "${VERSION}" "${PREV_VERSION}" \
            > "dist/llm-usage-widget_v${VERSION}_manifest.json"

      - name: 尝试生成增量更新包 delta.zip
        shell: bash
        env:
          TAG: ${{ steps.tag.outputs.tag }}
          PREV_TAG: ${{ steps.prev.outputs.tag }}
        run: |
          VERSION="${TAG#v}"
          DELTA_ZIP="dist/llm-usage-widget_v${VERSION}_delta.zip"
          DELTA_JSON="dist/llm-usage-widget_v${VERSION}_delta.json"
          echo "当前 tag: $TAG, 上一个 tag: ${PREV_TAG:-无}"
          if [ -n "$PREV_TAG" ]; then
            mkdir -p /tmp/prev
            MANIFEST_URL="https://github.com/joeyxd19/llm-usage-widget/releases/download/${PREV_TAG}/llm-usage-widget_${PREV_TAG}_manifest.json"
            echo "尝试下载上一版本 manifest: $MANIFEST_URL"
            if curl -fsSL -o /tmp/prev/manifest.json "$MANIFEST_URL"; then
              echo "已获取 $PREV_TAG 的 manifest，开始生成 delta"
              python scripts/generate_delta.py \
                "dist/onedir/llm-usage-widget" \
                "dist/llm-usage-widget_v${VERSION}_manifest.json" \
                "/tmp/prev/manifest.json" \
                "$DELTA_ZIP" "$DELTA_JSON" \
                || echo "delta 生成失败，将回退为完整包"
            else
              echo "无法下载上一版本 manifest，delta 将回退为完整包"
            fi
          fi
          if [ -f "$DELTA_ZIP" ]; then
            ls -lh "$DELTA_ZIP"
          else
            echo "未生成 delta.zip，回退到复制完整 update.zip"
          fi

      - name: 打包单文件 EXE（便携备选）
        shell: bash
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          VERSION="${TAG#v}"
          pyinstaller --onefile --noconsole --clean \
            --collect-all customtkinter \
            --distpath dist/onefile --workpath build/onefile \
            --name "llm-usage-widget_v${VERSION}" \
            src/usage_widget.pyw

      - name: 打包自动更新补丁包（不再作为便携版分发）
        shell: pwsh
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          $v = $env:TAG.Substring(1)
          # 把 manifest.json 也放进 update.zip，便于离线核对
          Copy-Item "dist/llm-usage-widget_v${v}_manifest.json" `
            "dist/onedir/llm-usage-widget/manifest.json" -Force
          Compress-Archive -Path "dist/onedir/llm-usage-widget" `
            -DestinationPath "dist/llm-usage-widget_v${v}_update.zip" -Force

      - name: 编译安装包 Setup.exe
        shell: pwsh
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          $v = $env:TAG.Substring(1)
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DMyAppVersion=$v" scripts/setup.iss

      - name: 补齐 delta.zip（生成失败时回退为完整 update.zip）
        shell: pwsh
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          $v = $env:TAG.Substring(1)
          $delta = "dist/llm-usage-widget_v${v}_delta.zip"
          if (-not (Test-Path $delta)) {
            Copy-Item "dist/llm-usage-widget_v${v}_update.zip" $delta -Force
          }

      - name: 上传到 Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          files: |
            dist/onefile/*.exe
            dist/installer/*.exe
            dist/llm-usage-widget_v*_update.zip
            dist/llm-usage-widget_v*_delta.zip
            dist/llm-usage-widget_v*_manifest.json
