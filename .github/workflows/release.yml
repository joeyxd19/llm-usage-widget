name: 打包 Windows EXE

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "要构建的 tag（如 v2.4.3），留空则使用最新 tag"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: 解析目标 tag
        id: tag
        shell: bash
        run: |
          if [ -n "${{ github.event.inputs.tag }}" ]; then
            TAG="${{ github.event.inputs.tag }}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::非法 tag「$TAG」：需形如 v2.6.0（手动触发时请填写 tag 输入，留空会误用分支名）"
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: 检出代码
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.tag.outputs.tag }}

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装依赖
        run: pip install pyinstaller==6.22.3 customtkinter==6.0.0

      - name: 安装 Inno Setup
        run: choco install innosetup -y

      - name: 打包 onedir（安装包内容源）
        shell: bash
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          VERSION="${TAG#v}"
          pyinstaller --noconsole --clean \
            --collect-all customtkinter \
            --distpath dist/onedir --workpath build/onedir \
            --name "llm-usage-widget" \
            src/usage_widget.pyw

      - name: 打包单文件 EXE（便携备选）
        shell: bash
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          VERSION="${TAG#v}"
          pyinstaller --onefile --noconsole --clean \
            --collect-all customtkinter \
            --distpath dist/onefile --workpath build/onefile \
            --name "llm-usage-widget_v${VERSION}" \
            src/usage_widget.pyw

      - name: 打包自动更新补丁包（不再作为便携版分发）
        shell: pwsh
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          $v = $env:TAG.Substring(1)
          Compress-Archive -Path "dist/onedir/llm-usage-widget" `
            -DestinationPath "dist/llm-usage-widget_v${v}_update.zip" -Force

      - name: 编译安装包 Setup.exe
        shell: pwsh
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          $v = $env:TAG.Substring(1)
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DMyAppVersion=$v" scripts/setup.iss

      - name: 上传到 Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          files: |
            dist/onefile/*.exe
            dist/llm-usage-widget_v*_update.zip
            dist/installer/*.exe
